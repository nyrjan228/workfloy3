name: BuzzFile Parser

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: buzzfile-parser
  cancel-in-progress: false

jobs:
  parse:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run parser
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PROXIES: ${{ secrets.PROXIES }}
          START_BATCH: ${{ vars.START_BATCH }}
          MAX_RUNTIME_SECONDS: 19800
          PYTHONUNBUFFERED: "1"
        run: python -u bf_parser.py

      - name: Commit results back to repo
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/companies.csv data/checkpoint.txt data/failed_links_batches.csv data/failed_companies_batches.csv 2>/dev/null || true
          git diff --cached --quiet || git commit -m "Update parsed data [skip ci]"
          git push

      - name: Upload results as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: buzzfile-results-${{ github.run_number }}
          path: |
            data/companies.csv
            data/failed_links_batches.csv
            data/failed_companies_batches.csv
          if-no-files-found: warn
          retention-days: 30
